<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob 'N' Buns | Table QR Stand & Tent Card Generator (Menu & Google Review)</title>
  <meta name="description" content="Generate and print high-resolution desk tent cards and acrylic stands with dual QR codes for Bob 'N' Buns: Menu PDF and Google Review.">
  <link rel="stylesheet" href="table-stand.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
</head>
<body>

  <!-- Customizer & Print Toolbar (Hidden during print) -->
  <header class="customizer-toolbar no-print">
    <div class="toolbar-container">
      <div class="toolbar-top-row">
        <div class="toolbar-title-group">
          <span style="font-size: 1.8rem;">🍔</span>
          <div>
            <h1>Bob 'N' Buns Table QR Generator</h1>
            <p>Dual QR Desk Stands for Menu PDF & Google Reviews • Print-ready for tables & acrylic stands</p>
          </div>
        </div>

        <div class="toolbar-actions">
          <a href="index.html" class="btn-outline">
            <span>←</span> Back to Menu
          </a>
          <button type="button" class="btn-outline" id="downloadMenuSvgBtn" title="Download Menu QR code in vector SVG format">
            <span>📥</span> Menu QR (SVG)
          </button>
          <button type="button" class="btn-outline" id="downloadReviewSvgBtn" title="Download Google Review QR code in vector SVG format">
            <span>📥</span> Review QR (SVG)
          </button>
          <button type="button" class="btn-print" id="printBtn">
            <span>🖨️</span> Print Desk Card
          </button>
        </div>
      </div>

      <!-- Controls Form -->
      <div class="toolbar-controls-grid">
        <div class="control-item">
          <label for="menuUrlInput">Menu Target URL</label>
          <input type="url" id="menuUrlInput" class="control-input" value="https://bobnbuns.netlify.app" placeholder="https://bobnbuns.netlify.app">
        </div>

        <div class="control-item">
          <label for="reviewUrlInput">Google Review URL</label>
          <input type="url" id="reviewUrlInput" class="control-input" value="https://share.google/Tr1mjQjTwQxDnojWD" placeholder="https://share.google/Tr1mjQjTwQxDnojWD">
        </div>

        <div class="control-item">
          <label for="tableNumInput">Table Number (Optional)</label>
          <input type="text" id="tableNumInput" class="control-input" placeholder="e.g. 1, 2, VIP, or leave blank">
        </div>

        <div class="control-item">
          <label for="layoutSelect">Stand Layout</label>
          <select id="layoutSelect" class="control-select">
            <option value="tent" selected>Foldable Triangle Tent (2-Sided)</option>
            <option value="acrylic">Acrylic Stand Insert (Side-by-Side)</option>
            <option value="separate">Separate Individual Cards (2 Cards)</option>
          </select>
        </div>

        <div class="control-item">
          <label for="themeSelect">Card Theme</label>
          <select id="themeSelect" class="control-select">
            <option value="dark" selected>Bob 'N' Buns Dark (Premium)</option>
            <option value="light">Crisp White (Ink-Saver)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Print Preview Stage -->
  <main class="preview-stage">
    <div id="standPreviewContainer" class="stand-preview-wrapper theme-dark layout-tent">
      <!-- Injected dynamically by table-stand.js -->
    </div>
  </main>

  <script src="table-stand.js"></script>
</body>
</html>
