# Netlify Configuration for Bob 'N' Buns

[build]
  publish = "."

# Instant Direct Google Review Dialog Redirect
[[redirects]]
  from = "/review"
  to = "https://www.google.com/search?kgmid=/g/11nv727jc5&hl=en-IN&q=BobNBuns&shem=epsd1,ltae,rimspwouoe&shndl=30&source=sh/x/loc/osrp/m5/1&kgs=d67c33ee5378d4a9#lrd=/g/11nv727jc5,3,,,"
  status = 302
  force = true

[[redirects]]
  from = "/google-review"
  to = "https://www.google.com/search?kgmid=/g/11nv727jc5&hl=en-IN&q=BobNBuns&shem=epsd1,ltae,rimspwouoe&shndl=30&source=sh/x/loc/osrp/m5/1&kgs=d67c33ee5378d4a9#lrd=/g/11nv727jc5,3,,,"
  status = 302
  force = true

# Clean Menu & Table Stand Links
[[redirects]]
  from = "/menu"
  to = "/bobnbuns-menu.pdf"
  status = 200

[[redirects]]
  from = "/pdf"
  to = "/bobnbuns-menu.pdf"
  status = 200

[[redirects]]
  from = "/table"
  to = "/table-stand.html"
  status = 200

[[redirects]]
  from = "/qr"
  to = "/table-stand.html"
  status = 200

# Cache & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/bobnbuns-menu.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/pdf"

[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=604800"

